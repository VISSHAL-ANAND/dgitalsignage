<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>KIDS LAB Display</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="player-body">
  <div id="player-root" class="player-root">
    <div class="player-brand"><span class="brand-mark">K</span><span><strong>KIDS LAB</strong><small>INNOVATION · DESIGN · BUILD</small></span></div>
    <div id="player-content" class="player-content"><div class="player-welcome"><p class="eyebrow">KIDS LAB / DIGITAL CANVAS</p><h1>Ideas become<br><em>what's next.</em></h1><p>Preparing display…</p></div></div>
    <div class="player-footer"><span id="display-name">KIDS LAB DISPLAY</span><span id="player-clock"></span><span id="player-count">CONNECTING</span></div>
  </div>
  <script>
  (() => {
    const displayId = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || 'main');
    const root = document.getElementById('player-content');
    const clock = document.getElementById('player-clock');
    const count = document.getElementById('player-count');
    const displayName = document.getElementById('display-name');
    let items = [], index = 0, timer = null, refreshTimer = null, ytPlayer = null;
    let ytApiReady = false, pendingYouTube = false;
    window.onYouTubeIframeAPIReady = () => { ytApiReady = true; if (pendingYouTube) startYouTube(); };
    function startYouTube() {
      pendingYouTube = false;
      const item = items[index % items.length];
      if (!item || item.mime_type !== 'video/youtube') return;
      if (ytPlayer && typeof ytPlayer.destroy === 'function') { try { ytPlayer.destroy(); } catch {} }
      ytPlayer = new YT.Player('youtube-player', {
        videoId: item.filename,
        playerVars: { autoplay: 1, controls: 0, rel: 0, playsinline: 1, enablejsapi: 1 },
        events: {
          onReady: event => { event.target.mute(); event.target.playVideo(); },
          onStateChange: event => { if (event.data === YT.PlayerState.ENDED) next(); },
          onError: () => next()
        }
      });
    }
    function loadYouTubeApi() {
      if (window.YT && window.YT.Player) { ytApiReady = true; return; }
      if (!document.getElementById('youtube-iframe-api')) {
        const script = document.createElement('script');
        script.id = 'youtube-iframe-api';
        script.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(script);
      }
    }
    const escapeHtml = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function tick() { clock.textContent = new Intl.DateTimeFormat(undefined,{weekday:'short',hour:'2-digit',minute:'2-digit'}).format(new Date()); }
    function render() {
      clearTimeout(timer);
      if (!items.length) {
        root.innerHTML = '<div class="player-welcome"><p class="eyebrow">KIDS LAB / DIGITAL CANVAS</p><h1>Your next big idea<br><em>starts here.</em></h1><p>Open the admin dashboard to add content to this display.</p></div>';
        count.textContent = 'NO CONTENT';
        return;
      }
      const item = items[index % items.length];
      count.textContent = String((index % items.length) + 1).padStart(2,'0') + ' / ' + String(items.length).padStart(2,'0');
      if (item.mime_type === 'video/youtube') {
        root.innerHTML = '<div id="youtube-player" class="player-media"></div>';
        loadYouTubeApi();
        if (ytApiReady) startYouTube(); else pendingYouTube = true;
      } else if (item.media_type === 'video') {
        root.innerHTML = '<video class="player-media" src="' + escapeHtml(item.url) + '" autoplay muted playsinline></video>';
        const video = root.querySelector('video');
        video.addEventListener('ended', next, { once: true });
        video.addEventListener('error', next, { once: true });
        video.play().catch(next);
      } else {
        root.innerHTML = '<img class="player-media" alt="' + escapeHtml(item.title) + '" src="' + escapeHtml(item.url) + '"><div class="player-caption"><span>' + escapeHtml(item.title) + '</span></div>';
        timer = setTimeout(next, (Number(item.duration) || 10) * 1000);
      }
    }
    function next() { clearTimeout(timer); index = (index + 1) % Math.max(items.length, 1); render(); }
    async function load() {
      try {
        const response = await fetch('/api/player/' + encodeURIComponent(displayId), {cache:'no-store'});
        if (!response.ok) throw new Error('Display not found or server unavailable');
        const data = await response.json();
        displayName.textContent = data.display.name.toUpperCase();
        const old = items.map(x => x.id).join(',');
        items = data.items;
        if (old !== items.map(x => x.id).join(',')) { index = 0; render(); }
        if (!items.length) render();
      } catch (err) {
        root.innerHTML = '<div class="player-welcome"><p class="eyebrow">DISPLAY OFFLINE</p><h1>Reconnecting<span class="loading-dots">…</span></h1><p>' + escapeHtml(err.message) + '</p></div>';
        count.textContent = 'RETRYING';
      }
    }
    tick(); setInterval(tick, 15000);
    load(); refreshTimer = setInterval(load, 30000);
    document.addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === ' ') next(); });
  })();
  </script>
</body>
</html>
