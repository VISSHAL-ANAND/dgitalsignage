<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>KIDS LAB Display</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="player-body">
  <div id="player-root" class="player-root">
    <div id="player-content" class="player-content"></div>
    <div id="break-screen" hidden></div>
  </div>
  <script>
  (() => {
    const displayId = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || 'main');
    const root = document.getElementById('player-content');
    const breakScreen = document.getElementById('break-screen');
    let items = [], index = 0, timer = null, refreshTimer = null, ytPlayer = null;
    let mode = 'play', lastRenderedId = null;
    let ytApiReady = false, pendingYouTube = false;
    window.onYouTubeIframeAPIReady = () => { ytApiReady = true; if (pendingYouTube) startYouTube(); };
    function startYouTube() {
      pendingYouTube = false;
      const item = items[index % items.length];
      if (!item || item.mime_type !== 'video/youtube') return;
      if (ytPlayer && typeof ytPlayer.destroy === 'function') { try { ytPlayer.destroy(); } catch {} }
      ytPlayer = new YT.Player('youtube-player', {
        videoId: item.filename,
        playerVars: { autoplay: 1, controls: 0, rel: 0, playsinline: 1, enablejsapi: 1 },
        events: {
          onReady: event => { event.target.mute(); event.target.playVideo(); },
          onStateChange: event => { if (event.data === YT.PlayerState.ENDED) next(); },
          onError: () => next()
        }
      });
    }
    function loadYouTubeApi() {
      if (window.YT && window.YT.Player) { ytApiReady = true; return; }
      if (!document.getElementById('youtube-iframe-api')) {
        const script = document.createElement('script');
        script.id = 'youtube-iframe-api';
        script.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(script);
      }
    }
    const escapeHtml = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function applyMode(nextMode) {
      if (nextMode === mode) return;
      mode = nextMode;
      if (mode === 'freeze') {
        clearTimeout(timer);
        const video = root.querySelector('video');
        if (video) video.pause();
        if (ytPlayer && ytPlayer.pauseVideo) { try { ytPlayer.pauseVideo(); } catch {} }
      } else if (mode === 'break') {
        clearTimeout(timer);
        if (ytPlayer && ytPlayer.stopVideo) { try { ytPlayer.stopVideo(); } catch {} }
        root.style.visibility = 'hidden';
        breakScreen.hidden = false;
      } else {
        breakScreen.hidden = true;
        root.style.visibility = 'visible';
        render();
      }
    }
    function render() {
      clearTimeout(timer);
      if (mode !== 'play') return;
      if (!items.length) { root.innerHTML = ''; return; }
      const item = items[index % items.length];
      lastRenderedId = item.id;
      if (item.mime_type === 'video/youtube') {
        root.innerHTML = '<div id="youtube-player" class="player-media"></div>';
        loadYouTubeApi();
        if (ytApiReady) startYouTube(); else pendingYouTube = true;
      } else if (item.media_type === 'video') {
        root.innerHTML = '<video class="player-media" src="' + escapeHtml(item.url) + '" autoplay muted playsinline></video>';
        const video = root.querySelector('video');
        video.preload = 'auto';
        video.addEventListener('ended', next, { once: true });
        video.addEventListener('error', () => { timer = setTimeout(next, 3000); }, { once: true });
        video.addEventListener('waiting', () => root.classList.add('buffering'));
        video.addEventListener('playing', () => root.classList.remove('buffering'));
        video.play().catch(() => { video.controls = true; });
      } else {
        root.innerHTML = '<img class="player-media" alt="" src="' + escapeHtml(item.url) + '">';
        timer = setTimeout(next, (Number(item.duration) || 10) * 1000);
      }
    }
    function next() { if (mode !== 'play') return; clearTimeout(timer); index = (index + 1) % Math.max(items.length, 1); render(); }
    async function load() {
      try {
        const response = await fetch('/api/player/' + encodeURIComponent(displayId), {cache:'no-store'});
        if (!response.ok) throw new Error('Display not found or server unavailable');
        const data = await response.json();
        const old = items.map(x => x.id).join(',');
        items = data.items;
        applyMode(data.mode || 'play');
        if (old !== items.map(x => x.id).join(',')) { index = 0; lastRenderedId = null; if (mode === 'play') render(); }
        if (items.length && mode === 'play' && lastRenderedId !== items[index % items.length].id) render();
      } catch (err) {
        root.innerHTML = '';
      }
    }
    load(); refreshTimer = setInterval(load, 2000);
  })();
  </script>
</body>
</html>
